        /* Clock styles - Multiple vintage pocket watch designs */
        
        /* Style 1: Classic Vintage Pocket Watch */
        .clock-container.clock-style-1 {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            background: radial-gradient(circle at center, #f8f4e5 0%, #e6dbb9 100%);
            border-radius: 50%;
            box-shadow: 
                0 8px 20px rgba(0,0,0,0.2),
                inset 0 2px 4px rgba(255,255,255,0.8),
                inset 0 -2px 8px rgba(0,0,0,0.15),
                0 0 0 8px #8b4513,
                0 0 0 12px #a0522d;
        }
        
        .clock-container.clock-style-1 .clock-face {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #ffffff 0%, #f0f0f0 100%);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .clock-container.clock-style-1 .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Times New Roman', serif;
            color: #333;
        }
        
        .clock-container.clock-style-1 .clock-number span {
            display: block;
            transform: translateY(-50%);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }
        
        /* Style 2: Ornate Pocket Watch */
        .clock-container.clock-style-2 {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            background: radial-gradient(circle at center, #d4af37 0%, #b8860b 100%);

                0 8px 25px rgba(0,0,0,0.25),

        }
        
        .clock-container.clock-style-2 .clock-face {

            left: 12%;

            height: 76%;

        }
        
        .clock-container.clock-style-2 .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;

            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }
        
        /* Style 3: Simple Elegant Pocket Watch */
        .clock-container.clock-style-3 {
            position: relative;

            padding-top: 100%; /* 1:1 Aspect Ratio */

        .clock-container.clock-style-3 .clock-face {
            position: absolute;
            top: 8%;
            left: 8%;
            width: 84%;
            height: 84%;

        .clock-container.clock-style-3 .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Arial', sans-serif;
            color: #212121;
        }
        
        .clock-container.clock-style-3 .clock-number span {
            display: block;
            transform: translateY(-50%);
        }
        
        /* Common styles for all clocks */
        .clock-face {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
        }
        
        .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        
        .clock-number span {
            display: block;
            transform: translateY(-50%);
            /* Fix for numbers being cut off */
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
        }
        
        /* Clock marks for all styles */
        .clock-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }
        
        .clock-face::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 8px;
            height: 2px;
            background: #333;
            transform: translateY(-50%);
        }
        
        .clock-face .mark {
            position: absolute;
            background: #666;
            transform-origin: center;
        }
        
        .clock-face .mark-hour {
            width: 3px;
            height: 10px;
            background: #333;
        }
        
        .clock-face .mark-minute {
            width: 1px;
            height: 6px;
            background: #666;
        }
        
        /* Clock hands for all styles */
        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 6px 6px 0 0;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .clock-container.clock-style-1 .hour-hand,
        .clock-container.clock-style-2 .hour-hand,
        .clock-container.clock-style-3 .hour-hand {
            width: 6px;
            height: 30%;
            background: linear-gradient(to top, #333 0%, #222 100%);
            margin-left: -3px;
            border: 1px solid #444;
        }
        
        .clock-container.clock-style-1 .minute-hand,
        .clock-container.clock-style-2 .minute-hand,
        .clock-container.clock-style-3 .minute-hand {
            width: 4px;
            height: 40%;
            background: linear-gradient(to top, #555 0%, #333 100%);
            margin-left: -2px;
            border: 1px solid #666;
        }
        
        .clock-container.clock-style-1 .second-hand,
        .clock-container.clock-style-2 .second-hand {
            width: 2px;
            height: 45%;
            background: linear-gradient(to top, #dc143c 0%, #b22222 100%);

        .clock-center {

            width: 14px;

                0 0 0 2px #8b0000,
                inset 0 1px 2px rgba(255,255,255,0.3);
        }
    </style>

    <script type="text/javascript">
        // Clock functionality to display local time
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            // Calculate angles for each hand
            const hourAngle = (hours * 30) + (minutes * 0.5);
            const minuteAngle = (minutes * 6) + (seconds * 0.1);
            const secondAngle = seconds * 6;
            
            // Update the clock hands
            const hourHand = document.getElementById('hourHand');
            const minuteHand = document.getElementById('minuteHand');
            const secondHand = document.getElementById('secondHand');
            
            if (hourHand && minuteHand && secondHand) {
                hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
                minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
                secondHand.style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;
            }
        }
        
        // Change clock style function
        function changeClockStyle(styleNumber) {
            const clockContainer = document.getElementById('clockContainer');
            if (clockContainer) {
                // Remove all style classes
                clockContainer.classList.remove('clock-style-1', 'clock-style-2', 'clock-style-3');
                // Add the selected style class
                clockContainer.classList.add(`clock-style-${styleNumber}`);
            }
        }
        
        // Initialize clock and update every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
